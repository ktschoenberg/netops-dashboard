<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITO Network L3 · Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ─── Untitled UI v8 Tokens ─── */
:root {
  --g950:#0C111D; --g900:#101828; --g800:#1D2939; --g700:#344054;
  --g600:#475467; --g500:#667085; --g400:#98A2B3; --g300:#D0D5DD;
  --g200:#EAECF0; --g150:#F2F4F7; --g100:#F9FAFB; --white:#FFFFFF;

  --blue700:#175CD3; --blue600:#1570EF; --blue500:#2E90FA;
  --blue100:#D1E9FF; --blue50:#EFF8FF;

  --green700:#027A48; --green600:#039855; --green500:#12B76A;
  --green100:#D1FADF; --green50:#ECFDF3;

  --orange700:#B54708; --orange600:#DC6803; --orange500:#F79009;
  --orange100:#FEF0C7; --orange50:#FFFAEB;

  --red600:#D92D20; --red50:#FEF3F2;

  --side-bg:#0C111D; --side-border:#161B27; --side-active:#1D2939;
  --side-text:#7A8899; --side-text-active:#FFFFFF;

  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-sm:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --sh-md:0 4px 8px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --sh-panel:-8px 0 40px rgba(16,24,40,.14);

  --r4:4px; --r6:6px; --r8:8px; --r12:12px; --rfull:9999px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --sidebar-w:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--g100);color:var(--g900);display:flex;min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ══ SIDEBAR ══ */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--side-bg);border-right:1px solid var(--side-border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.s-logo{display:flex;align-items:center;gap:9px;padding:16px 14px;border-bottom:1px solid var(--side-border)}
.s-mark{width:32px;height:32px;border-radius:var(--r8);background:linear-gradient(135deg,var(--blue600),#6941C6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-mark svg{width:17px;height:17px}
.s-appname{font-size:12.5px;font-weight:700;color:var(--white);line-height:1.2}
.s-appver{font-size:10.5px;color:var(--white)}
.s-nav{padding:8px 6px;flex:1}
.s-sec{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.07em;padding:10px 8px 3px}
.s-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r6);color:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .12s,color .12s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.s-item:hover{background:#161B27;color:#FFFFFF}
.s-item.active{background:var(--side-active);color:var(--side-text-active)}
.s-item svg{width:15px;height:15px;flex-shrink:0;opacity:1}
.s-item.active svg{opacity:1}
.s-pill{margin-left:auto;background:var(--orange500);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:var(--rfull);line-height:1.7}
.s-pill.blue{background:var(--blue600)}
.s-foot{padding:10px 12px 14px;border-top:1px solid var(--side-border)}
.s-user{display:flex;align-items:center;gap:9px}
.s-av{width:30px;height:30px;border-radius:var(--rfull);background:var(--orange500);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
.s-uname{font-size:12.5px;font-weight:600;color:var(--white)}
.s-urole{font-size:10.5px;color:rgba(255,255,255,.5)}

/* ══ MAIN ══ */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--g200);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:var(--sh-xs)}
.tb-title{font-size:14.5px;font-weight:700;color:var(--g900)}
.tb-crumb{font-size:12px;color:var(--g500);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:9px}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--g100);border:1px solid var(--g200);color:var(--g600);font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:var(--rfull)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green500);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r6);font-size:12.5px;font-weight:500;cursor:pointer;border:none;font-family:var(--font);transition:all .12s}
.btn-ghost{background:var(--white);color:var(--g700);border:1px solid var(--g300);box-shadow:var(--sh-xs)}
.btn-ghost:hover{background:var(--g100)}
.btn-primary{background:var(--g900);color:var(--white)}
.btn-primary:hover{background:var(--g800)}
.btn-sm{padding:5px 11px;font-size:12px}
.filterbar{background:var(--white);border-bottom:1px solid var(--g200);padding:5px 28px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:sticky;top:58px;z-index:89}
.dr-lbl{font-size:11px;font-weight:600;color:var(--g500);margin-right:4px;white-space:nowrap}
.dr-btn{font-size:11px;font-weight:600;padding:4px 11px;border-radius:6px;border:1px solid var(--g200);background:var(--g50);color:var(--g600);cursor:pointer;transition:all .13s;line-height:1}
.dr-btn:hover{background:var(--g100);border-color:var(--g400)}
.dr-btn.active{background:var(--orange600);color:#fff;border-color:var(--orange600)}
.dr-range-info{margin-left:auto;font-size:11px;color:var(--g400);font-style:italic}

/* ══ PAGE ══ */
.page{padding:24px 28px 56px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:15px;font-weight:700;color:var(--g900)}
.sec-sub{font-size:12.5px;color:var(--g500);margin-top:2px}

/* ══ ALERT BANNER ══ */
.alert-bar{display:flex;align-items:center;gap:10px;background:var(--orange50);border:1px solid var(--orange100);border-left:3px solid var(--orange500);border-radius:var(--r6);padding:10px 14px;font-size:12.5px;color:var(--orange700);margin-bottom:22px;cursor:pointer;transition:background .12s}
.alert-bar:hover{background:var(--orange100)}
.alert-bar svg{flex-shrink:0;width:15px;height:15px}
.alert-bar strong{font-weight:600}
.alert-bar .alert-link{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--orange600);white-space:nowrap}

/* ══ KPI GRID ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:14px 18px;box-shadow:var(--sh-xs);cursor:pointer;transition:box-shadow .15s,transform .1s;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.kpi-label{font-size:11.5px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.04em}
.kpi-icon{width:30px;height:30px;border-radius:var(--r6);background:var(--g100);display:flex;align-items:center;justify-content:center;color:var(--g500)}
.kpi-icon svg{width:16px;height:16px}
.kpi-num{font-size:27px;font-weight:800;color:var(--g900);letter-spacing:-.03em;line-height:1;margin-bottom:6px}
.kpi-num.orange{color:var(--orange600)}
.kpi-num sup{font-size:16px;font-weight:600;color:var(--g400)}
.kpi-foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--g500)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1.5px 7px;border-radius:var(--rfull);font-size:11px;font-weight:600}
.chip-g{background:var(--g150);color:var(--g700)}
.chip-green{background:var(--green50);color:var(--green700)}
.chip-orange{background:var(--orange50);color:var(--orange700)}
.chip-blue{background:var(--blue50);color:var(--blue700)}

/* ══ INSIGHTS ══ */
.insights-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.insights-col{display:flex;flex-direction:column;gap:12px}
.insights-col-head{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.insights-col-head svg{width:15px;height:15px}
.insights-col-head span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ins-col-positive .insights-col-head svg{color:var(--green600)}
.ins-col-positive .insights-col-head span{color:var(--green700)}
.ins-col-improve .insights-col-head svg{color:var(--orange600)}
.ins-col-improve .insights-col-head span{color:var(--orange700)}
.icard{background:var(--white);border:1px solid var(--g200);border-radius:var(--r8);padding:14px 16px;box-shadow:var(--sh-xs);border-left:3px solid transparent;display:flex;flex-direction:column;gap:4px}
.icard-positive{border-left-color:var(--green500)}
.icard-improve{border-left-color:var(--orange500)}
.icard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.icard h4{font-size:13px;font-weight:700;color:var(--g900)}
.icard-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--rfull);white-space:nowrap;flex-shrink:0}
.icard-positive .icard-tag{background:var(--green50);color:var(--green700)}
.icard-improve .icard-tag{background:var(--orange50);color:var(--orange700)}
.icard p{font-size:12px;color:var(--g500);line-height:1.6;margin-top:1px}
.icard .icard-metric{font-size:11.5px;font-weight:600;color:var(--g700);margin-top:4px}

/* ══ TEAM SECTION ══ */
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.tc{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--sh-xs);cursor:pointer;transition:box-shadow .15s,transform .1s;position:relative}
.tc:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tc-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}
.tc-av{width:36px;height:36px;border-radius:var(--rfull);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--white);flex-shrink:0;letter-spacing:.03em}
.tc-open-badge{background:var(--orange50);border:1px solid var(--orange100);color:var(--orange600);font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--rfull)}
.tc-num{font-size:24px;font-weight:800;color:var(--g900);letter-spacing:-.03em;line-height:1.1;margin-bottom:2px}
.tc-name{font-size:13px;font-weight:700;color:var(--g900);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-pct{font-size:11.5px;color:var(--g500)}
.tc-bar-row{margin:7px 0 7px;display:flex;align-items:center;gap:8px}
.tc-bar-track{flex:1;height:4px;background:var(--g200);border-radius:var(--rfull);overflow:hidden}
.tc-bar-fill{height:100%;border-radius:var(--rfull);background:var(--orange500)}
.tc-tags{display:flex;flex-wrap:wrap;gap:5px}
.tc-tag{background:var(--g100);color:var(--g600);font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:var(--rfull)}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--g150)}
.tc-res{font-size:11.5px;color:var(--g500)}
.tc-res strong{color:var(--green600);font-weight:600}
.tc-res strong.warn{color:var(--orange600)}
.tc-view{font-size:11px;font-weight:600;color:var(--g400)}

/* ══ CHARTS ROW ══ */
.charts-row{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:22px}
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:20px 22px;box-shadow:var(--sh-xs)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:14px;font-weight:700;color:var(--g900)}
.card-sub{font-size:12px;color:var(--g500);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--g600)}
.leg-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Category bars */
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer;padding:4px 6px;border-radius:var(--r6);transition:background .1s}
.cat-row:hover{background:var(--g100)}
.cat-label{font-size:12px;color:var(--g700);font-weight:500;width:160px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-track{flex:1;height:7px;background:var(--g150);border-radius:var(--rfull);overflow:hidden}
.cat-fill{height:100%;border-radius:var(--rfull);background:var(--orange500);transition:width .5s cubic-bezier(.4,0,.2,1)}
.cat-count{font-size:12px;font-weight:700;color:var(--g900);width:22px;text-align:right;flex-shrink:0}

/* ══ TABLES ══ */
.table-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);box-shadow:var(--sh-xs);overflow:hidden;margin-bottom:16px}
.table-head-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.table-title{font-size:14px;font-weight:700;color:var(--g900)}
.table-sub{font-size:12px;color:var(--g500);margin-top:1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;padding:8px 16px;background:var(--g100);border-bottom:1px solid var(--g200)}
td{padding:11px 16px;font-size:12.5px;color:var(--g700);border-bottom:1px solid var(--g150);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--g100)}
.tnum{font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;font-weight:700;color:var(--blue600);background:var(--blue50);padding:2px 7px;border-radius:var(--r4);white-space:nowrap}
.tdesc{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--g900)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--rfull);font-size:11px;font-weight:600;white-space:nowrap}
.b-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-open{background:var(--orange50);color:var(--orange700)}
.b-open .b-dot{background:var(--orange500)}
.b-closed{background:var(--green50);color:var(--green700)}
.b-closed .b-dot{background:var(--green500)}
.b-restored{background:var(--blue50);color:var(--blue700)}
.b-restored .b-dot{background:var(--blue500)}
.b-inc{background:var(--g150);color:var(--g700)}
.b-adr{background:#F0F0FF;color:#5B4CC5}
.b-cat{background:var(--g100);color:var(--g600)}

/* ══ SLIDE PANEL ══ */
.panel-overlay{position:fixed;inset:0;background:rgba(16,24,40,.35);opacity:0;pointer-events:none;transition:opacity .22s;z-index:190}
.panel-overlay.show{opacity:1;pointer-events:all}
.panel{position:fixed;top:0;right:0;height:100vh;width:520px;background:var(--white);box-shadow:var(--sh-panel);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:translateX(0)}
.panel-topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--g200);min-height:57px;flex-shrink:0}
.panel-back{background:none;border:1px solid var(--g200);border-radius:var(--r6);padding:4px 10px;font-size:12px;color:var(--g600);cursor:pointer;font-family:var(--font);font-weight:500;display:flex;align-items:center;gap:5px;transition:all .1s;flex-shrink:0}
.panel-back:hover{background:var(--g100)}
.panel-back svg{width:12px;height:12px}
.panel-title{font-size:14px;font-weight:700;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-close{background:none;border:none;cursor:pointer;color:var(--g400);padding:4px;border-radius:var(--r4);display:flex;align-items:center;justify-content:center;transition:color .1s,background .1s;flex-shrink:0}
.panel-close:hover{background:var(--g150);color:var(--g700)}
.panel-close svg{width:16px;height:16px}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--g300);border-radius:2px}

/* Panel — tech profile */
.tp-hero{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--g100);border-radius:var(--r8);margin-bottom:16px}
.tp-av{width:48px;height:48px;border-radius:var(--rfull);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--white);flex-shrink:0}
.tp-name{font-size:16px;font-weight:700;color:var(--g900)}
.tp-role{font-size:12px;color:var(--g500);margin-top:1px}
.tp-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tp-stat{background:var(--g100);border-radius:var(--r8);padding:12px 14px;text-align:center}
.tp-stat .val{font-size:20px;font-weight:800;color:var(--g900);letter-spacing:-.02em;line-height:1}
.tp-stat .lbl{font-size:11px;color:var(--g500);margin-top:3px}
.tp-section-title{font-size:12px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;margin-top:16px}
.tp-cat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tp-cat-label{font-size:12px;color:var(--g700);font-weight:500;width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-cat-track{flex:1;height:5px;background:var(--g200);border-radius:var(--rfull);overflow:hidden}
.tp-cat-fill{height:100%;border-radius:var(--rfull);background:var(--orange500)}
.tp-cat-count{font-size:11.5px;font-weight:700;color:var(--g900);width:18px;text-align:right;flex-shrink:0}

/* Panel — ticket detail */
.td-header{margin-bottom:16px}
.td-num{font-family:'SF Mono','Fira Code',monospace;font-size:12px;font-weight:700;color:var(--blue600);background:var(--blue50);padding:3px 9px;border-radius:var(--r4);display:inline-block;margin-bottom:8px}
.td-desc{font-size:16px;font-weight:700;color:var(--g900);line-height:1.4;margin-bottom:12px}
.td-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.td-field{background:var(--g100);border-radius:var(--r6);padding:10px 12px}
.td-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--g400);margin-bottom:3px}
.td-field-val{font-size:13px;font-weight:600;color:var(--g900)}
.td-related-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--g100);border-radius:var(--r6);margin-bottom:6px;cursor:pointer;transition:background .1s}
.td-related-item:hover{background:var(--g150)}

/* Panel — ticket list */
.pl-filter-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pl-count{font-size:13px;font-weight:700;color:var(--g900)}
.pl-count span{color:var(--g500);font-weight:400}
.pl-ticket{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--white);border:1px solid var(--g200);border-radius:var(--r8);margin-bottom:8px;cursor:pointer;transition:background .1s,box-shadow .1s}
.pl-ticket:hover{background:var(--g100);box-shadow:var(--sh-xs)}
.pl-ticket-left{flex:1;min-width:0}
.pl-ticket-num{font-family:'SF Mono','Fira Code',monospace;font-size:11px;font-weight:700;color:var(--blue600)}
.pl-ticket-desc{font-size:12.5px;font-weight:600;color:var(--g900);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-ticket-meta{font-size:11px;color:var(--g400)}
.pl-ticket-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}

/* ══ MISC ══ */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
.gap-22{margin-bottom:22px}
.divider{height:1px;background:var(--g200);margin:16px 0}

/* ══ ROLE SWITCHER ══ */
.seg-ctrl{display:flex;background:var(--g150);border:1px solid var(--g200);border-radius:var(--r6);padding:2px;gap:2px}
.seg-btn{padding:5px 14px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;font-family:var(--font);color:var(--g500);transition:all .15s;white-space:nowrap}
.seg-btn.active{background:var(--white);color:var(--g900);box-shadow:var(--sh-xs)}
.seg-btn:not(.active):hover{color:var(--g700)}
.tb-sep{width:1px;height:18px;background:var(--g200);flex-shrink:0}

/* ══ VIEWS ══ */
.view{display:none}.view.active{display:block}

/* ══ DIGEST ROW ══ */
.digest-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.digest-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:18px 20px;box-shadow:var(--sh-xs)}
.d-label{font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}
.d-num{font-size:28px;font-weight:800;color:var(--g900);letter-spacing:-.03em;margin:8px 0 5px}
.d-change{font-size:12px;color:var(--g500)}.d-change .good{color:var(--green600);font-weight:600}.d-change .warn{color:var(--orange600);font-weight:600}

/* ══ PRIORITY BADGES ══ */
.p1{background:#FEF3F2;color:#B42318;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--rfull);white-space:nowrap}
.p2{background:var(--orange50);color:var(--orange700);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--rfull);white-space:nowrap}
.p3{background:var(--g150);color:var(--g600);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--rfull);white-space:nowrap}
.p4{background:var(--g100);color:var(--g400);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--rfull);white-space:nowrap}

/* ══ DIRECTOR CHARTS 3-COL ══ */
.charts-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}

/* ══ BENCHMARKS ══ */
.bench-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.bench-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--sh-xs)}
.bench-lbl{font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.bench-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bench-name{font-size:12px;color:var(--g600)}
.bench-val{font-size:13px;font-weight:700;color:var(--g900)}
.bench-delta{font-size:11px;font-weight:700;padding:1.5px 6px;border-radius:var(--rfull)}
.bench-delta.up{background:var(--ok50);color:var(--ok700)}
.bench-delta.down{background:var(--orange50);color:var(--orange700)}
.btrack{height:4px;background:var(--g200);border-radius:var(--rfull);margin-top:5px;margin-bottom:10px;overflow:hidden}
.bfill{height:100%;border-radius:var(--rfull)}

/* ══ STABILITY GAUGE ══ */
.stab-gauge{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stab-inner{width:56px;height:56px;background:var(--white);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stab-inner .sv{font-size:16px;font-weight:800;color:var(--g900);line-height:1;letter-spacing:-.02em}
.stab-inner .sl{font-size:8px;color:var(--g500);margin-top:1px}

/* ══ RISK REGISTER ══ */
.risk-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.risk-item{background:var(--white);border:1px solid var(--g200);border-radius:var(--r8);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:box-shadow .12s}
.risk-item:hover{box-shadow:var(--sh-sm)}
.risk-sev{padding:3px 10px;border-radius:var(--rfull);font-size:10.5px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:1px}
.risk-high{background:#FEF3F2;color:#B42318}
.risk-med{background:var(--orange50);color:var(--orange700)}
.risk-title{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:3px}
.risk-desc{font-size:12px;color:var(--g500);line-height:1.6}
.risk-owner{font-size:11px;color:var(--g400);margin-top:5px;font-style:italic}

/* ══ EXEC SUMMARY ══ */
.exec-summary{background:linear-gradient(135deg,var(--g900) 0%,var(--g800) 100%);border-radius:var(--r12);padding:24px 28px;margin-bottom:22px}
.exec-summary h3{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.exec-summary .headline{font-size:16px;font-weight:600;color:var(--white);line-height:1.55;margin-bottom:20px}
.exec-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.em-val{font-size:22px;font-weight:800;color:var(--white);letter-spacing:-.02em;line-height:1}
.em-lbl{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.em-delta{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.75);margin-top:4px}
</style>
</head>

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function fmt(d){ const p=d.split('-'); return p[1]+'/'+p[2]+'/'+p[0].slice(2); }
function age(d){ return Math.floor((new Date('2026-05-19')-new Date(d+'T00:00:00'))/(1000*60*60*24)); }
function shortName(n){ const p=n.split(' '); return p[0]+' '+p[p.length-1]; }
function stateBadge(s){
  if(s==='open')     return `<span class="badge b-open"><span class="b-dot"></span>Open</span>`;
  if(s==='restored') return `<span class="badge b-restored"><span class="b-dot"></span>Service Restored</span>`;
  return `<span class="badge b-closed"><span class="b-dot"></span>Closed</span>`;
}
function typeBadge(t){ return t==='INC'?'<span class="badge b-inc">INC</span>':'<span class="badge b-adr">ADR</span>'; }

/* ═══════════════════════════════════════
   TEAM CARDS
═══════════════════════════════════════ */
function buildTeamCards(){
  const grid = document.getElementById('teamGrid');
  if(!grid) return;
  const maxCount = 24;
  TEAM_META.forEach(m => {
    const mine = T.filter(t=>t.who===m.name);
    const total = mine.length;
    const pct = ((total/59)*100).toFixed(1);
    const openCount = mine.filter(t=>t.state==='open').length;
    const resRate = Math.round(((total-openCount)/total)*100);

    // top 2 categories
    const cats = {};
    mine.forEach(t => cats[t.cat]=(cats[t.cat]||0)+1);
    const topCats = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,2);
    const catTags = topCats.map(([c])=>`<span class="tc-tag">${c}</span>`).join('');

    const barPct = Math.round((total/maxCount)*100);

    grid.insertAdjacentHTML('beforeend', `
      <div class="tc" onclick="openTechProfile('${m.name}')">
        <div class="tc-head">
          <div class="tc-av" style="background:${m.color}">${m.init}</div>
          <div class="tc-name">${m.name}</div>
          ${openCount>0?`<span class="tc-open-badge">⚠ ${openCount} open</span>`:''}
        </div>
        <div class="tc-num">${total} <span style="font-size:14px;font-weight:500;color:var(--g400);letter-spacing:0">tickets</span></div>
        <div class="tc-pct">${pct}% of total · ITO Network L3</div>
        <div class="tc-bar-row">
          <div class="tc-bar-track"><div class="tc-bar-fill" style="width:${barPct}%"></div></div>
          <span style="font-size:11px;color:var(--g400);flex-shrink:0">${total}/59</span>
        </div>
        <div class="tc-tags">${catTags}</div>
        <div class="tc-foot">
          <span class="tc-res">Resolution: <strong ${openCount>0?'class="warn"':''}>${resRate}%</strong></span>
          <span class="tc-view">View tickets →</span>
        </div>
      </div>
    `);
  });
}

/* ═══════════════════════════════════════
   OPEN TICKETS TABLE
═══════════════════════════════════════ */
function buildOpenTable(){
  const focus = T.filter(t=>t.state==='open'||t.state==='restored');
  const tb = document.getElementById('openTbl');
  focus.forEach(t => {
    const d = age(t.opened);
    const ageColor = t.state==='open' ? (d>7?'var(--red600)':d>3?'var(--orange600)':'var(--green600)') : 'var(--g500)';
    const ageBadge = t.state==='open'
      ? (d>7 ? '<span style="font-size:9px;background:var(--red50);color:var(--red600);padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px">SLA risk</span>'
             : d>3 ? '<span style="font-size:9px;background:var(--orange50);color:var(--orange600);padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px">Monitor</span>'
             : '<span style="font-size:9px;background:var(--green50);color:var(--green600);padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px">On track</span>')
      : '';
    tb.insertAdjacentHTML('beforeend', `
      <tr onclick="openTicketDetail('${t.num}')">
        <td><span class="tnum">${t.num}</span></td>
        <td>${priorityBadge(t.cat)}</td>
        <td><span class="tdesc">${t.desc}</span></td>
        <td style="white-space:nowrap">${t.who}</td>
        <td style="color:var(--g500);white-space:nowrap">${fmt(t.opened)}</td>
        <td><span style="font-weight:700;color:${ageColor}">${d}d</span>${ageBadge}</td>
        <td style="white-space:nowrap;color:var(--g600)">${LOA_TICKET_HRS[t.num]!=null?LOA_TICKET_HRS[t.num]+'h':'—'}</td>
        <td>${stateBadge(t.state)}</td>
      </tr>
    `);
  });
}

  setTimeout(()=>{ panelStack=[]; renderPanel(); },250);
}

function pushPanel(view, props){
  panelStack.push({view,props});
  renderPanel();
  if(panelStack.length===1) openPanel();
}
function popPanel(){
  panelStack.pop();
  if(panelStack.length===0) closePanel();
  else renderPanel();
}

function renderPanel(){
  if(!panelStack.length){ panelTopbar.innerHTML=''; panelBody.innerHTML=''; return; }
  const {view,props} = panelStack[panelStack.length-1];
  const canBack = panelStack.length>1;
  const backBtn = canBack ? `<button class="panel-back" onclick="popPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Back</button>` : '';
  const closeBtn = `<button class="panel-close" onclick="closePanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  if(view==='tech'){
    panelTopbar.innerHTML = `${backBtn}<span class="panel-title">${props.name}</span>${closeBtn}`;
    panelBody.innerHTML = renderTechProfile(props.name);
  } else if(view==='tickets'){
    const {label,filter} = props;
    panelTopbar.innerHTML = `${backBtn}<span class="panel-title">${label}</span>${closeBtn}`;
    panelBody.innerHTML = renderTicketList(filter);
  } else if(view==='detail'){
    panelTopbar.innerHTML = `${backBtn}<span class="panel-title">Ticket Detail</span>${closeBtn}`;
    panelBody.innerHTML = renderTicketDetail(props.num);
  } else if(view==='html'){
    panelTopbar.innerHTML = `${backBtn}<span class="panel-title">${props.title}</span>${closeBtn}`;
    panelBody.innerHTML = props.body;
  }
  panelBody.scrollTop = 0;
}

const builtViews = new Set(['director']);
window._dateRange = 'all';

function getDateFilter(range=window._dateRange||'all'){
  if(range === 'all') return null;
  const today = new Date();
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayStr = fmt(today);
  if(range === 'thisweek'){
    const dow = today.getDay(); // 0=Sun
    const mon = new Date(today); mon.setDate(today.getDate()-(dow===0?6:dow-1));
    return {start:fmt(mon), end:todayStr};
  }
  if(range === 'lastweek'){
    const dow = today.getDay();
    const mon = new Date(today); mon.setDate(today.getDate()-(dow===0?6:dow-1));
    const lMon = new Date(mon); lMon.setDate(mon.getDate()-7);
    const lSun = new Date(mon); lSun.setDate(mon.getDate()-1);
    return {start:fmt(lMon), end:fmt(lSun)};
  }
  if(range === 'ttd'){
    const start = new Date(today.getFullYear(), 0, 1);
    return {start:fmt(start), end:todayStr};
  }
  if(range === '6m'){
    const start = new Date(today); start.setMonth(today.getMonth()-6);
    return {start:fmt(start), end:todayStr};
  }
  if(range === '1y'){
    const start = new Date(today); start.setFullYear(today.getFullYear()-1);
    return {start:fmt(start), end:todayStr};
  }
  const days = range==='30d'?30:range==='60d'?60:90;
  const start = new Date(today); start.setDate(today.getDate()-days);
  return {start:fmt(start), end:todayStr};
}

function getActiveT(){
  const f = getDateFilter();
  if(!f) return T;
  return T.filter(t=>t.opened>=f.start && t.opened<=f.end);
}

function getActiveCHG(){
  const f = getDateFilter();
  if(!f) return CHG_DATA;
  return CHG_DATA.filter(c=>c.start>=f.start && c.start<=f.end);

function buildTeamHoursChart(){
  const names=TEAM_META.map(m=>shortName(m.name));
  const filtLOA=window._filtLOA||LOA_ENG;
  const hrs=TEAM_META.map(m=>(filtLOA[m.name]||{totalHrs:0}).totalHrs);
  const colors=TEAM_META.map(()=>'#F79009');
  Chart.getChart('teamHoursChart')?.destroy();
  window._teamHoursChart=new Chart(document.getElementById('teamHoursChart'),{
    type:'bar',
    data:{labels:names,datasets:[{label:'Hours',data:hrs,backgroundColor:colors,borderRadius:4,borderSkipped:false}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:i=>i.raw.toFixed(0)+'h'}}},
      scales:{
        x:{grid:{color:'#F2F4F7'},border:{display:false},ticks:{color:'#667085',font:{size:11},callback:v=>v+'h'}},
        y:{grid:{display:false},border:{display:false},ticks:{color:'#667085',font:{size:11}}}
      },
      onClick(e,els){ if(!els.length) return; setTeamEngFilter(TEAM_META[els[0].index].name); },
      onHover(e,els){ e.native.target.style.cursor=els.length?'pointer':'default'; }
    }
  });
}

function setTeamEngFilter(name){
  window._teamEngFilter=(window._teamEngFilter===name)?null:name;
  const f=window._teamEngFilter;
  const engColors={'Jason Candler':'#F79009','Khaled Shalati':'#2E90FA','Patrick Djemba Tchounke':'#6941C6','Yadwinder Singh':'#12B76A','Harry Midy':'#EE46BC','Shaun Dees':'#667085'};
  document.querySelectorAll('#teamEffTable tbody tr').forEach(row=>{
    row.style.opacity=(!f||row.dataset.eng===f)?'1':'0.25';
  });
  document.querySelectorAll('[data-eng-card]').forEach(card=>{
    card.style.outline=(f&&card.dataset.engCard===f)?'2px solid #2E90FA':'';
    card.style.outlineOffset='2px';
  });
  if(window._teamHoursChart){
    window._teamHoursChart.data.datasets[0].backgroundColor=TEAM_META.map(m=>
      (!f||m.name===f)?'#F79009':'#F7900944'
    );
    window._teamHoursChart.update('none');
  }
  const chip=document.getElementById('teamEngFilterChip');
  if(chip){
    if(f){
      chip.innerHTML='<span style="display:inline-flex;align-items:center;gap:6px;background:var(--blue50);color:var(--blue700);border-radius:var(--rfull);padding:4px 12px;font-size:12px;font-weight:600;border:1px solid var(--blue200)">'
        +'Filtering: '+shortName(f)
        +' <button onclick="setTeamEngFilter(\''+f+'\')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--blue600);padding:0;line-height:1">×</button>'
        +'</span>';
    } else {
      chip.innerHTML='';
    }
  }
}

function buildChangeSchedulePage(){
  const page = document.getElementById('changeSchedPage');
  const CHGf = getActiveCHG();

  const total   = CHGf.length;
  const openCHG = CHGf.filter(c=>c.state==='open');
  const closed  = CHGf.filter(c=>c.state==='closed');
  const success = total>0?Math.round(closed.length/total*100):0;

  // Engineer breakdown
  const engMap = {};
  CHGf.forEach(c=>{
    if(!c.who) return;
    if(!engMap[c.who]) engMap[c.who]={total:0,open:0,closed:0};
    engMap[c.who].total++;
    if(c.state==='open') engMap[c.who].open++;
    else engMap[c.who].closed++;
  });
  const engList = Object.entries(engMap).sort((a,b)=>b[1].total-a[1].total);
  const engMax  = engList[0]?engList[0][1].total:1;

  // Type breakdown
  const typeMap={};
  CHGf.forEach(c=>{ if(c.type) typeMap[c.type]=(typeMap[c.type]||0)+1; });
  const typeEntries=Object.entries(typeMap).sort((a,b)=>b[1]-a[1]);

  // Work type breakdown
  const wtMap={};
  CHGf.forEach(c=>{ if(c.workType) wtMap[c.workType]=(wtMap[c.workType]||0)+1; });
  const wtEntries=Object.entries(wtMap).sort((a,b)=>b[1]-a[1]);

  // Monthly volume (last 12 months)
  const monthKeys=['2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'];
  const monthLabels=['Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'];
  const monthCounts=monthKeys.map(m=>CHGf.filter(c=>c.month===m).length);
  const monthMax=Math.max(...monthCounts,1);

  // Open changes table rows
  const openRows = openCHG.sort((a,b)=>a.start.localeCompare(b.start)).map(c=>{
    const approvalColor=c.approval==='Approved'?'var(--green600)':c.approval==='Requested'?'var(--orange600)':'var(--g500)';
    const shortDesc=c.desc.length>55?c.desc.slice(0,55)+'...':c.desc;
    const shortWho=c.who.split(' ').slice(0,2).map((w,i)=>i===0?w.charAt(0).toUpperCase()+'.':w).join(' ');
    return '<tr onclick="openCHGDetail(\''+c.num+'\')" data-who="'+c.who+'" style="cursor:pointer">'
      +'<td style="font-family:monospace;font-size:12px;font-weight:700;color:var(--blue600)">'+c.num+'</td>'
      +'<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+c.desc.replace(/"/g,"&quot;")+'">'+shortDesc+'</td>'
      +'<td>'+shortWho+'</td>'
      +'<td style="color:var(--g600);font-size:12px">'+c.ci+'</td>'
      +'<td><span style="font-size:11px;background:var(--blue50);color:var(--blue700);padding:2px 7px;border-radius:10px;font-weight:600">'+c.type+'</span></td>'

function setCHGEngFilter(name){
  window._chgEngFilter = (window._chgEngFilter === name) ? null : name;
  const f = window._chgEngFilter;

  // Update toggle button active states
  document.querySelectorAll('[data-chg-eng]').forEach(btn=>{
    const isAll = btn.dataset.chgEng === '__all__';
    if(isAll){
      btn.style.background = f ? 'var(--g100)' : 'var(--blue600)';
      btn.style.color = f ? 'var(--g600)' : '#fff';
      btn.style.borderColor = f ? 'var(--g300)' : 'var(--blue600)';
    } else {
      const active = btn.dataset.chgEng === f;
      const origBg = btn.getAttribute('data-orig-bg') || '';
      const origCol = btn.getAttribute('data-orig-col') || '';
      if(!btn.getAttribute('data-orig-bg')){
        btn.setAttribute('data-orig-bg', btn.style.background);
        btn.setAttribute('data-orig-col', btn.style.color);
        btn.setAttribute('data-orig-border', btn.style.borderColor);
      }
      btn.style.background = active ? 'var(--blue600)' : btn.getAttribute('data-orig-bg');
      btn.style.color = active ? '#fff' : btn.getAttribute('data-orig-col');
      btn.style.borderColor = active ? 'var(--blue600)' : btn.getAttribute('data-orig-border');
      btn.style.opacity = (!f || active) ? '1' : '0.45';
    }
  });

  // Show/hide table rows and update badge count
  let vis = 0;
  document.querySelectorAll('#chgOpenTbody tr').forEach(row=>{
    const show = !f || row.dataset.who === f;
    row.style.display = show ? '' : 'none';
    if(show) vis++;
  });
  const badge = document.getElementById('chgOpenBadge');
  if(badge) badge.textContent = vis + ' open';

  // Dim/highlight engineer bar rows
  document.querySelectorAll('[data-chg-bar]').forEach(bar=>{
    bar.style.opacity = (!f || bar.dataset.chgBar === f) ? '1' : '0.25';
  });
}

function openFilteredCHGPanel(opts){
  const {label, state} = opts;
  let list = state ? CHG_DATA.filter(c=>c.state===state) : CHG_DATA.slice();
  list.sort((a,b)=>b.start.localeCompare(a.start));
  const rows = list.map(c=>{
    const shortDesc=c.desc.length>60?c.desc.slice(0,60)+'...':c.desc;
    const shortWho=c.who.split(' ').slice(0,2).map((w,i)=>i===0?w.charAt(0).toUpperCase()+'.':w).join(' ');
    const stateColor=c.state==='open'?'var(--orange600)':'var(--green600)';
    return '<tr onclick="openCHGDetail(\''+c.num+'\')" style="cursor:pointer">'
      +'<td style="font-family:monospace;font-size:12px;font-weight:700;color:var(--blue600)">'+c.num+'</td>'
      +'<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+shortDesc+'</td>'
      +'<td>'+shortWho+'</td>'
      +'<td style="font-size:11px;color:var(--g600)">'+c.type+'</td>'
      +'<td style="font-size:12px">'+c.start+'</td>'
      +'<td><span style="font-weight:600;color:'+stateColor+'">'+c.state.toUpperCase()+'</span></td>'
      +'</tr>';
  }).join('');
  const body='<div style="padding:16px 20px">'
    +'<table class="tbl"><thead><tr><th>CHG #</th><th>Description</th><th>Assigned To</th><th>Type</th><th>Start</th><th>State</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
  pushPanel('html', {title: label, body});
}

function openCHGDetail(num){
  const c = CHG_DATA.find(x=>x.num===num);
  if(!c) return;
  const stateColor=c.state==='open'?'var(--orange600)':'var(--green600)';
  const approvalColor=c.approval==='Approved'?'var(--green600)':c.approval==='Requested'?'var(--orange600)':'var(--g500)';
  const body=`<div class="td-wrap">
    <div class="td-num">${c.num}</div>
    <div class="td-desc">${c.desc}</div>

      <div class="td-field"><div class="td-field-label">State</div><div class="td-field-val" style="font-weight:700;color:${stateColor}">${c.state.toUpperCase()}</div></div>

const MTTR_BY_CAT = {
  'Monitoring Alerts':0.5,
  'Connectivity & Performance':1.5,
  'Hardware & Physical':3.5,
  'ISP & Fiber':2.0,
  'VLAN & Config':1.5,
  'Circuit Decommission':6.0,
  'Change Monitoring':4.0,
  'Other / General':2.0,
};
function estMTTR(t){ return MTTR_BY_CAT[t.cat]||2.0; }
function teamMTTR(name){
  const mine=T.filter(t=>t.who===name&&t.state!=='open');
  if(!mine.length) return '0.0';
  return (mine.reduce((s,t)=>s+estMTTR(t),0)/mine.length).toFixed(1);
}
const _allClosed=T.filter(t=>t.state!=='open');
const GLOBAL_MTTR=(_allClosed.reduce((s,t)=>s+estMTTR(t),0)/_allClosed.length).toFixed(1);

  const filtMTTR=closed.length>0?(closed.reduce((s,t)=>s+estMTTR(t),0)/closed.length).toFixed(1):GLOBAL_MTTR;
  const stabScore=Math.min(100,Math.round(parseFloat(resRate)*0.4+30+(parseFloat(filtMTTR)<=4?20:10)+(noiseRatio<=25?10:5)));

function buildDirGlance(){
  const el=document.getElementById('dirGlance');
  const today=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const MNAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
  // Build last 6 months including current
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(today.getFullYear(),today.getMonth()-i,1);
    const mKey=d.getFullYear()+'-'+pad(d.getMonth()+1);
    const isCurrent=i===0;
    const shortLabel=MNAMES[d.getMonth()]+' '+d.getFullYear();
    const label=shortLabel+(isCurrent?' (partial)':'');
    months.push({mKey,label,shortLabel,isCurrent});
  }
  // Compute avg monthly volume for spike detection
  const totalTickets=T.length;
  const allMonths=[...new Set(T.map(t=>t.month))].length||1;
  const avgMonthly=totalTickets/allMonths;

  const rows=months.map(({mKey,label,shortLabel,isCurrent})=>{
    const mt=T.filter(t=>t.month===mKey);
    const total=mt.length;
    const inc=mt.filter(t=>t.type==='INC').length;
    const adr=mt.filter(t=>t.type==='ADR').length;
    // Auto-generate note
    const cats={};
    mt.forEach(t=>{cats[t.cat]=(cats[t.cat]||0)+1;});
    const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    const openCt=mt.filter(t=>t.state==='open'||t.state==='restored').length;
    let note='';
    if(total===0){ note='No tickets recorded.'; }
    else {
      if(isCurrent) note+='Partial month. ';
      if(total>avgMonthly*1.5) note+='Volume spike ('+Math.round(total/avgMonthly*10)/10+'× avg). ';
      else if(total<avgMonthly*0.7) note+='Quiet period. ';
      else note+='Normal volume. ';
      if(topCat) note+='Top category: '+topCat[0]+' ('+topCat[1]+'). ';
      if(openCt>0&&isCurrent) note+=openCt+' ticket'+(openCt>1?'s':'')+' still open.';
    }
    return '<tr style="cursor:pointer" data-glance-month="'+mKey+'" data-glance-label="'+shortLabel+' tickets" onclick="glanceRowClick(this)">'
      +'<td style="font-weight:700;color:var(--g900);white-space:nowrap">'+label+'</td>'
      +'<td style="font-weight:800;font-size:14px;color:var(--g900)">'+total+'</td>'
      +'<td style="font-weight:600;color:var(--orange600)">'+inc+'</td>'
      +'<td style="font-weight:600;color:var(--g600)">'+adr+'</td>'
      +'<td style="font-size:12px;color:var(--g600);line-height:1.5">'+note+'</td>'
      +'</tr>';
  }).join('');

  el.innerHTML='<div class="table-card" style="margin-bottom:22px"><div class="tw"><table>'
    +'<thead><tr><th>Month</th><th>Total</th><th>INC</th><th>ADR</th><th>Key Events</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table></div></div>';
}

function closeImportModal(){document.getElementById('importModal').style.display='none';window._importPending=null;}

function handleDrop(e){
  e.preventDefault();
  const dz=document.getElementById('dropzone');
  if(dz){dz.style.borderColor='var(--g300)';dz.style.background='';}
  const file=e.dataTransfer.files[0];
  if(file) processFile(file);
}

function handleImportFile(e){
  const file=e.target.files[0];
  if(!file)return;
  e.target.value='';
  processFile(file);
}

function processFile(file){
  const isExcel=/\.(xlsx|xls)$/i.test(file.name);
  const reader=new FileReader();
  if(isExcel){
    reader.onload=ev=>processExcel(new Uint8Array(ev.target.result),file.name);
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload=ev=>processImportCSV(ev.target.result,file.name);
    reader.readAsText(file);
  }
}

function parseCSVLine(line){
  const res=[];let inQ=false,cur='';
  for(const ch of line){
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){res.push(cur);cur='';}
    else cur+=ch;
  }
  res.push(cur);
  return res;
}

function inferCat(desc){
  if(/circuit decommission/i.test(desc))           return 'Circuit Decommission';
  if(/vlan|dhcp/i.test(desc))                      return 'VLAN & Config';
  if(/interface down|services switch|issue detected|sdwan|snmp|ddos/i.test(desc)) return 'Monitoring Alerts';
  if(/fiber|verizon|dwdm/i.test(desc))             return 'ISP & Fiber';
  if(/sfp|disc failure|flash error|port channel|console server/i.test(desc)) return 'Hardware & Physical';
  if(/packet loss|bgp|retransmit|unreachable|performance|availability|vmotion/i.test(desc)) return 'Connectivity & Performance';
  if(/change monitoring|monitor session/i.test(desc)) return 'Change Monitoring';
  return 'Other / General';
}

function inferState(row){
  const st=(row.state||'').toLowerCase().trim();
  const act=row.active==='true';
  const isADR=(row.number||'').startsWith('ADR');
  if(st==='closed')return 'closed';
  if(st==='service restored'&&!isADR&&act)return 'restored';
  if(act)return 'open';
  return 'closed';
}

function toTitleCase(s){
  return s.trim().split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1).toLowerCase():'').join(' ');
}

function processImportCSV(text,filename){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  if(lines.length<2){alert('CSV appears empty or invalid.');return;}
  const headers=parseCSVLine(lines[0]).map(h=>h.replace(/"/g,'').trim());
  const rows=lines.slice(1).map(l=>{
    const vals=parseCSVLine(l);
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/^"|"$/g,'').trim());
    return obj;
  });
  // Detect LOE (Level of Effort) format by checking for ServiceNow time-tracking headers
  if(headers.some(h=>h==='u_time_worked'||h==='u_task')){
    processImportLOA(rows,filename);
    return;
  }
  processImportRows(rows,filename);
}

function processImportLOA(rows,filename){
  const newTicketHrs={};
  const engAgg={};
  rows.forEach(r=>{
    const eng=(r.u_assigned_to||'').trim();
    const task=(r.u_task||'').trim();
    const secs=parseFloat(r.u_time_worked)||0;
    const created=(r.sys_created_on||'').slice(0,7);
    if(!eng||!task||secs<=0) return;
    const hrs=secs/3600;
    newTicketHrs[task]=(newTicketHrs[task]||0)+hrs;
    if(!engAgg[eng]) engAgg[eng]={totalHrs:0,ticketSet:new Set(),monthly:{}};
    engAgg[eng].totalHrs+=hrs;
    engAgg[eng].ticketSet.add(task);
    if(created) engAgg[eng].monthly[created]=(engAgg[eng].monthly[created]||0)+hrs;
  });

  const ticketCount=Object.keys(newTicketHrs).length;
  const engCount=Object.keys(engAgg).length;

  // Merge into live LOE constants (objects are mutable even when const)
  Object.assign(LOA_TICKET_HRS,newTicketHrs);
  Object.keys(engAgg).forEach(eng=>{
    const a=engAgg[eng];
    if(LOA_ENG[eng]){
      LOA_ENG[eng].totalHrs+=a.totalHrs;
      LOA_ENG[eng].ticketCount=Math.max(LOA_ENG[eng].ticketCount,a.ticketSet.size);
      Object.keys(a.monthly).forEach(mo=>{ LOA_ENG[eng].monthly[mo]=(LOA_ENG[eng].monthly[mo]||0)+a.monthly[mo]; });
    } else {
      LOA_ENG[eng]={totalHrs:a.totalHrs,ticketCount:a.ticketSet.size,monthly:a.monthly};
    }
  });

  // Rebuild team view if it was already rendered
  if(builtViews.has('team')){
    builtViews.delete('team');
    if(document.getElementById('view-team').classList.contains('active')){
      builtViews.add('team'); buildTeamView();
    }
  }

  // Show success modal
  document.getElementById('importModal').style.display='flex';
  document.getElementById('importModalBody').innerHTML=`
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:36px;margin-bottom:12px">✓</div>
      <div style="font-size:16px;font-weight:800;color:var(--g900);margin-bottom:6px">LOE Data Imported</div>
      <div style="font-size:13px;color:var(--g600);margin-bottom:20px">${filename}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
        <div style="background:var(--g100);border-radius:var(--r8);padding:12px;text-align:center">
          <div style="font-size:22px;font-weight:800;color:var(--g900)">${rows.length}</div>
          <div style="font-size:11px;color:var(--g500)">Records parsed</div>
        </div>
        <div style="background:var(--g100);border-radius:var(--r8);padding:12px;text-align:center">
          <div style="font-size:22px;font-weight:800;color:var(--g900)">${ticketCount}</div>
          <div style="font-size:11px;color:var(--g500)">Tickets updated</div>
        </div>
        <div style="background:var(--g100);border-radius:var(--r8);padding:12px;text-align:center">
          <div style="font-size:22px;font-weight:800;color:var(--g900)">${engCount}</div>
          <div style="font-size:11px;color:var(--g500)">Engineers found</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--g500)">LOA_TICKET_HRS and LOA_ENG updated in memory. Reload page to persist.</div>
    </div>
  `;
  document.getElementById('importModalFoot').innerHTML=`
    <button class="btn btn-primary" onclick="document.getElementById('importModal').style.display='none'">Done</button>
  `;
}

function processExcel(data,filename){
  try {
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:''});
    processImportRows(rows,filename);
  } catch(e){
    alert('Could not parse the file. Please check it is a valid Excel or CSV export.');
  }
}

function processImportRows(rows,filename){
  const get=(r,...keys)=>{for(const k of keys){const v=r[k]||r[k.toLowerCase()]||r[k.toUpperCase()]||'';if(v)return String(v).trim();}return '';};
  const tickets=rows.map(r=>{
    const num=get(r,'number','Number','NUMBER','Ticket');
    if(!num)return null;
    const type=num.startsWith('ADR')?'ADR':'INC';
    const opened=get(r,'opened_at','Opened At','opened','Date').split(' ')[0]||'';
    if(!opened)return null;
    const month=opened.substring(0,7);
    const desc=get(r,'short_description','Short Description','description','Description','Subject');
    const who=toTitleCase(get(r,'assigned_to','Assigned To','assignee','Assignee'));
    const stateRaw=get(r,'state','State','status','Status');
    const activeRaw=get(r,'active','Active');
    return {num,type,desc,who,opened,month,
      state:inferState({number:num,state:stateRaw,active:activeRaw||'false'}),
      cat:inferCat(desc)};
  }).filter(t=>t&&t.num&&t.opened);

  const existingNums=new Set(T.map(t=>t.num));
  const newTickets=tickets.filter(t=>!existingNums.has(t.num));
  const dupeTickets=tickets.filter(t=>existingNums.has(t.num));
  window._importPending={tickets,newTickets,dupeTickets};
  showImportModal(tickets,newTickets,dupeTickets,filename);
}

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--g500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>

    </div>

      </div>

  `;

    <button class="btn btn-ghost btn-sm" onclick="closeImportModal()">Cancel</button>
    ${newTickets.length>0?`<button class="btn btn-ghost btn-sm" onclick="applyImport('add')">Add ${newTickets.length} New Only</button>`:''}
    <button class="btn btn-primary btn-sm" onclick="applyImport('replace')">Replace All (${tickets.length} tickets)</button>
  `;
}

function applyImport(mode){
  const {tickets,newTickets}=window._importPending;
  if(mode==='replace'){
    T.length=0;
    tickets.sort((a,b)=>b.opened.localeCompare(a.opened)).forEach(t=>T.push(t));
  } else {
    newTickets.sort((a,b)=>b.opened.localeCompare(a.opened)).forEach(t=>T.unshift(t));
  }
  closeImportModal();
  rebuildDashboard();
}

  new Chart(document.getElementById('transCatChart'),{
    type:'bar',
    data:{labels,datasets:[{label:'INC',data:incData,backgroundColor:'#F79009',borderRadius:3,borderSkipped:false}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{...TT}},

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
        <div class="digest-card"><div class="d-label">INC Escalated</div><div class="d-num" style="font-size:24px">${d.inc}</div><div class="d-change">L2 → L3</div></div>
        <div class="digest-card"><div class="d-label">ADR Escalated</div><div class="d-num" style="font-size:24px">${d.adr}</div><div class="d-change">L2 → L3</div></div>
        <div class="digest-card"><div class="d-label">Escalation Rate</div><div class="d-num" style="font-size:24px">${rate}${rate!=='—'?'%':''}</div><div class="d-change">of INC+ADR volume</div></div>
      </div>
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;padding:0 20px 8px">Escalated Tickets · ${allTickets.length}</div>
    <div>${ticketList}</div>`;
  pushPanel('html',{title:label+' · Escalations',body});
}

function renderNocTicketList(tickets){
  if(!tickets.length) return '<div style="text-align:center;padding:40px;color:var(--g400);font-size:12px">No tickets in this range</div>';
  return tickets.map(t=>{
    const [num,opened,tp,st,ci,bi]=t;
    const numColor=tp===0?'#F79009':'#98A2B3';
    const cat=ci>=0?TNOC_CATS[ci]:'';
    const badge=st===0?'<span class="badge b-open"><span class="b-dot"></span>Open</span>':'<span class="badge b-closed"><span class="b-dot"></span>Closed</span>';
    const tbadge=tp===0?'<span class="badge b-inc">INC</span>':'<span class="badge b-adr">ADR</span>';
    return `<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--white);border:1px solid var(--g200);border-radius:var(--r8);margin-bottom:8px"><div class="pl-ticket-left"><div class="pl-ticket-num" style="color:${numColor}">${num}</div><div class="pl-ticket-meta">${cat?cat+' · ':''}${fmt(opened)}</div></div><div class="pl-ticket-right">${tbadge}${badge}</div></div>`;
  }).join('');
}
function openNocTicketPanel(title,tickets){
  const open=tickets.filter(t=>t[3]===0).length;
  const closed=tickets.length-open;
  const body=`<div style="padding:10px 14px;border-bottom:1px solid #F2F4F7;display:flex;align-items:center;gap:8px"><span style="font-size:13px;font-weight:600;color:var(--g900)">${tickets.length} ticket${tickets.length!==1?'s':''}</span>${open>0?`<span class="badge b-open"><span class="b-dot"></span>${open} open</span>`:''}<span class="badge b-closed"><span class="b-dot"></span>${closed} closed</span></div><div style="padding:8px 4px">${renderNocTicketList(tickets)}</div>`;
  pushPanel('html',{title,body});
}

function openTransMttrPanel(month,label,months){
  const l2=TRANS_L2_MTTR[month],l3=TRANS_L3_MTTR[month];
  const idx=months.indexOf(month);
  const prevM=idx>0?months[idx-1]:null;
  const prevL2=prevM?TRANS_L2_MTTR[prevM]:null,prevL3=prevM?TRANS_L3_MTTR[prevM]:null;
  const delta=(cur,prev,unit)=>prev==null?'':`<span style="color:${cur<=prev?'var(--green600)':'var(--orange600)'}">vs ${prev.toFixed(1)}${unit} prev</span>`;
  const allMonthRows=months.map(m=>{
    const lbl=TRANS_MONTH_LABELS[TRANS_MONTHS.indexOf(m)];
    return `<tr style="border-bottom:1px solid #F2F4F7${m===month?';background:#FFF9F0':''}">
      <td style="padding:7px 10px;font-size:12px;color:var(--g700);${m===month?'font-weight:600':''}">
        ${m===month?'▶ ':''}${lbl}</td>
      <td style="padding:7px 10px;font-size:12px;color:#F79009;text-align:right;font-weight:${m===month?700:400}">${TRANS_L2_MTTR[m]?.toFixed(1)??'—'}h</td>
      <td style="padding:7px 10px;font-size:12px;color:#98A2B3;text-align:right;font-weight:${m===month?700:400}">${TRANS_L3_MTTR[m]?.toFixed(1)??'—'}d</td>
    </tr>`;
  }).join('');
  const body=`
    <div style="padding:20px 20px 0">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
        <div class="digest-card"><div class="d-label">L2 Median MTTR</div><div class="d-num" style="font-size:24px">${l2?.toFixed(1)??'—'}h</div><div class="d-change">${delta(l2,prevL2,'h')}&nbsp;</div></div>
        <div class="digest-card"><div class="d-label">L3 Median MTTR</div><div class="d-num" style="font-size:24px">${l3?.toFixed(1)??'—'}d</div><div class="d-change">${delta(l3,prevL3,'d')}&nbsp;</div></div>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">All Months</div>
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:#F9FAFB">
          <th style="padding:7px 10px;font-size:11px;color:var(--g500);text-align:left;font-weight:500">Month</th>
          <th style="padding:7px 10px;font-size:11px;color:var(--g500);text-align:right;font-weight:500">L2 (hrs)</th>
          <th style="padding:7px 10px;font-size:11px;color:var(--g500);text-align:right;font-weight:500">L3 (days)</th>
        </tr></thead>
        <tbody>${allMonthRows}</tbody>
      </table>
    </div>`;
  pushPanel('html',{title:label+' · MTTR',body});
}

function buildTransBizChart(bizMap){
  const allSorted=Object.entries(bizMap).sort((a,b)=>b[1]-a[1]);
  const top=allSorted.slice(0,6);
  const otherCount=allSorted.slice(6).reduce((s,[,v])=>s+v,0);
  const labels=top.map(([n])=>n);
  const data=top.map(([,v])=>v);
  if(otherCount>0){labels.push('Other');data.push(otherCount);}
  Chart.getChart('transCIChart')?.destroy();
  if(!labels.length){const el=document.getElementById('transCIChart');if(el)el.parentElement.innerHTML='<div style="text-align:center;color:var(--g400);font-size:12px;padding:40px">No data in range</div>';return;}
  new Chart(document.getElementById('transCIChart'),{
    type:'bar',
    data:{labels,datasets:[{label:'INC',data,backgroundColor:'#F79009',borderRadius:3,borderSkipped:false}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{...TT}},
      scales:{
        x:{grid:{color:'#F2F4F7'},border:{display:false},ticks:{color:'#667085',font:{size:11}}},
        y:{grid:{display:false},border:{display:false},ticks:{color:'#667085',font:{size:10}}}
      },
      onClick(e,els){if(!els.length||labels[els[0].index]==='Other')return;const svc=labels[els[0].index];const bi=TNOC_BIZ.indexOf('> '+svc);const fm=transSectionData('cat').filtMonths;openNocTicketPanel(svc,TNOC.filter(t=>t[5]===bi&&fm.includes(t[1].slice(0,7))));},
      onHover(e,els){e.native.target.style.cursor=els.length&&labels[els[0].index]!=='Other'?'pointer':'default';}
    }
  });
}

function buildTransLoeCharts(incTTW,adrTTW){
  [['transLoeInc',incTTW,'#F79009'],['transLoeAdr',adrTTW,'#D0D5DD']].forEach(([id,loe,color])=>{
    const type=id==='transLoeInc'?'inc':'adr';
    const sorted=Object.entries(loe).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
    Chart.getChart(id)?.destroy();
    if(!sorted.length){const el=document.getElementById(id);if(el)el.parentElement.innerHTML='<div style="text-align:center;color:var(--g400);font-size:12px;padding:30px">No TTW data in range</div>';return;}
    new Chart(document.getElementById(id),{
      type:'bar',
      data:{labels:sorted.map(([n])=>n),datasets:[{label:'Hours',data:sorted.map(([,v])=>parseFloat(v.toFixed(1))),backgroundColor:color,borderRadius:4,borderSkipped:false}]},
      options:{
        indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:i=>i.raw.toFixed(1)+'h'}}},
        scales:{
          x:{grid:{color:'#F2F4F7'},border:{display:false},ticks:{color:'#667085',font:{size:11}}},
          y:{grid:{display:false},border:{display:false},ticks:{color:'#667085',font:{size:10}}}
        },
        onClick(e,els){if(!els.length)return;const sit=sorted[els[0].index][0];const ci=TNOC_CATS.indexOf(sit);const tp=id==='transLoeInc'?0:1;const fm=transSectionData('loe').filtMonths;openNocTicketPanel(sit+' · '+(tp===0?'INC':'ADR'),TNOC.filter(t=>t[2]===tp&&t[4]===ci&&fm.includes(t[1].slice(0,7))));},
        onHover(e,els){e.native.target.style.cursor=els.length?'pointer':'default';}
      }
    });
  });
}

function buildTransEscCharts(labels,incData,adrData,months){
  [['transEscInc',incData,'#F79009'],['transEscAdr',adrData,'#D0D5DD']].forEach(([id,data,color])=>{
    Chart.getChart(id)?.destroy();
    new Chart(document.getElementById(id),{
      type:'bar',
      data:{labels,datasets:[{label:'Escalated',data,backgroundColor:color,borderRadius:4,borderSkipped:false}]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT}},
        scales:{
          x:{grid:{display:false},border:{display:false},ticks:{color:'#667085',font:{size:11}}},
          y:{grid:{color:'#F2F4F7'},border:{display:false},ticks:{color:'#667085',font:{size:11},stepSize:2}}
        },
        onClick(e,els){if(!els.length)return;openTransEscPanel(months[els[0].index],labels[els[0].index],months);},
        onHover(e,els){e.native.target.style.cursor=els.length?'pointer':'default';}
      }
    });
  });
}

function buildTransMttrCharts(labels,l2Data,l3Data,months){
  [['transMttrL2',l2Data,'#F79009','h'],['transMttrL3',l3Data,'#D0D5DD','d']].forEach(([id,data,color,unit])=>{
    Chart.getChart(id)?.destroy();
    new Chart(document.getElementById(id),{
      type:'bar',
      data:{labels,datasets:[{data,backgroundColor:color,borderRadius:4,borderSkipped:false}]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:i=>i.raw!=null?i.raw.toFixed(1)+unit:'—'}}},
        scales:{
          x:{grid:{display:false},border:{display:false},ticks:{color:'#667085',font:{size:10},maxRotation:45}},
          y:{grid:{color:'#F2F4F7'},border:{display:false},ticks:{color:'#667085',font:{size:11},callback:v=>v+unit}}
        },
        onClick(e,els){if(!els.length||data[els[0].index]==null)return;const m=months[els[0].index],lbl=labels[els[0].index];if(id==='transMttrL2'){openNocTicketPanel(lbl+' · L2 INC',TNOC.filter(t=>t[2]===0&&t[1].slice(0,7)===m));}else{openTransEscPanel(m,lbl,months);}},
        onHover(e,els){e.native.target.style.cursor=els.length&&data[els[0].index]!=null?'pointer':'default';}
      }
    });
  });
}
