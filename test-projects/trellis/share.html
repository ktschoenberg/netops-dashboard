<title>THD Trellis &#8212; Talent-First Internal Mobility</title>
<style>


:root{
  --white:#FFFFFF;
  --g100:#FAFAF9; --g150:#F4F3F1; --g200:#EAE9E6; --g300:#D8D6D2;
  --g400:#A6A39D; --g500:#837F79; --g600:#635F59; --g700:#46433E;
  --g800:#2E2B27; --g900:#1E1B18; --g950:#131110;

  --orange500:#F96302; --orange600:#D9560A; --orange700:#B4470A;
  --orange100:#FCE0CF; --orange50:#FEF4EC; --orange-soft:#F9A05E;

  --green700:#027A48; --green600:#059669; --green500:#12B76A; --green100:#D1FADF; --green50:#ECFDF3;
  --blue700:#3A5A78; --blue600:#4C6A88; --blue500:#5F7A94; --blue100:#DDE7F0; --blue50:#F0F4F8;
  --purple600:#6938EF; --purple50:#F4F3FF; --purple700:#5925DC;
  --red600:#D92D20; --red700:#B42318; --red50:#FEF3F2;
  --yellow700:#B54708; --yellow500:#F79009; --yellow50:#FFFAEB;

  --side-bg:#F6F5F3; --side-border:#EAE9E6; --side-active:#FFFFFF;

  --sh-xs:0 1px 2px rgba(30,27,24,.04);
  --sh-sm:0 1px 3px rgba(30,27,24,.05),0 1px 2px rgba(30,27,24,.04);
  --sh-md:0 6px 20px -6px rgba(30,27,24,.09),0 2px 6px -2px rgba(30,27,24,.05);
  --sh-lg:0 18px 44px -10px rgba(30,27,24,.14);
  --sh-panel:-10px 0 48px rgba(30,27,24,.13);

  --r4:5px; --r6:7px; --r8:10px; --r12:14px; --r16:18px; --rfull:9999px;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-display:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --sidebar-w:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:14px;line-height:1.55;color:var(--g800);background:var(--g100);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;min-height:100vh}
::selection{background:var(--orange100)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:99px;border:2.5px solid var(--g100)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange500);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);position:fixed;top:0;left:0;height:100vh;background:var(--side-bg);
  border-right:1px solid var(--side-border);overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.s-logo{display:flex;align-items:center;gap:12px;padding:22px 20px 20px}
.s-mark{width:36px;height:36px;border-radius:var(--r8);background:var(--orange500);display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:#fff;letter-spacing:-.02em;flex-shrink:0;box-shadow:0 3px 10px rgba(249,99,2,.3)}
.s-mark svg{width:23px;height:23px}
.s-appname{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--g900);line-height:1;letter-spacing:.01em}
.s-appver{font-size:10.5px;color:var(--g500);letter-spacing:.05em;margin-top:3px;text-transform:uppercase}
.s-nav{padding:6px 13px;flex:1}
.s-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r8);color:var(--g600);
  font-size:13.5px;font-weight:500;cursor:pointer;transition:background .16s ease,color .16s ease;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.s-item svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.8;color:var(--g400);transition:color .16s}
.s-item:hover{background:rgba(30,27,24,.04);color:var(--g900)}
.s-item:hover svg{color:var(--g600)}
.s-item.active{background:var(--side-active);color:var(--g900);font-weight:600;box-shadow:var(--sh-sm)}
.s-item.active svg{color:var(--orange500)}
.s-pill{margin-left:auto;background:var(--g150);color:var(--g500);font-size:9.5px;font-weight:700;padding:2px 8px;
  border-radius:var(--rfull);line-height:1.6;letter-spacing:.03em}
.s-item.active .s-pill{background:var(--orange50);color:var(--orange700)}
.s-pill.green{background:var(--green50);color:var(--green700)}
.s-foot{padding:15px 18px;border-top:1px solid var(--side-border)}
.s-user{display:flex;align-items:center;gap:11px}
.s-av{width:36px;height:36px;border-radius:var(--rfull);background:var(--g900);display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:600;color:#fff;flex-shrink:0}
.s-uname{font-size:12.5px;font-weight:600;color:var(--g900);line-height:1.2}
.s-urole{font-size:10.5px;color:var(--g500)}

/* MAIN / TOPBAR */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:64px;background:rgba(250,250,249,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--g200);padding:0 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:90}
.tb-title{font-size:15px;font-weight:600;color:var(--g900);letter-spacing:-.01em;display:flex;align-items:center}
.tb-title em{font-family:var(--font);font-weight:600;font-style:normal;color:var(--orange700);font-size:9.5px;
  text-transform:uppercase;letter-spacing:.12em;background:var(--orange50);padding:3px 8px;border-radius:var(--rfull);margin-left:9px}
.tb-crumb{font-size:12px;color:var(--g500);margin-top:2px}
.tb-sep{width:1px;height:20px;background:var(--g200);flex-shrink:0}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.live-pill{display:flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--g200);color:var(--g600);
  font-size:11.5px;font-weight:500;padding:5px 13px;border-radius:var(--rfull);box-shadow:var(--sh-xs)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green500);box-shadow:0 0 0 3px var(--green50);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ham-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r8);
  border:1px solid var(--g200);background:#fff;cursor:pointer;color:var(--g700)}
.page{padding:32px 34px 24px;flex:1;max-width:1420px;width:100%;margin:0 auto}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--r8);font-size:12.5px;
  font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .16s ease;white-space:nowrap;letter-spacing:.01em}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn-primary{background:var(--g900);color:#fff;box-shadow:var(--sh-xs)}
.btn-primary:hover{background:#000;transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn-ghost{background:var(--white);color:var(--g700);border-color:var(--g300)}
.btn-ghost:hover{background:var(--g100);border-color:var(--g400)}
.btn-orange{background:var(--orange500);color:#fff;box-shadow:0 2px 10px rgba(249,99,2,.3)}
.btn-orange:hover{background:var(--orange600);transform:translateY(-1px);box-shadow:0 6px 18px rgba(249,99,2,.34)}
.btn-sm{padding:6px 12px;font-size:12px}

.seg-ctrl{display:inline-flex;background:var(--g150);border-radius:var(--rfull);padding:4px;gap:3px;border:1px solid var(--g200)}
.seg-btn{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--g500);padding:8px 18px;border-radius:var(--rfull);
  cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.seg-btn svg{width:15px;height:15px;stroke-width:2;opacity:.75}
.seg-btn:hover{color:var(--g800)}
.seg-btn.active{background:var(--white);color:var(--g900);box-shadow:var(--sh-sm)}
.seg-btn.active.talent{color:var(--orange600)}
.seg-btn.active.talent svg{opacity:1}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:28px}
.kpi{background:var(--white);border:1px solid var(--g200);border-radius:var(--r16);padding:20px 22px;box-shadow:var(--sh-xs);
  transition:box-shadow .2s ease,transform .2s ease}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-3px)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.kpi-label{font-size:10.5px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.11em}
.kpi-icon{width:34px;height:34px;border-radius:var(--r8);background:var(--orange50);display:flex;align-items:center;justify-content:center;color:var(--orange600)}
.kpi-icon svg{width:17px;height:17px;stroke-width:1.8}
.kpi-num{font-size:29px;font-weight:700;color:var(--g900);letter-spacing:-.035em;line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums}
.kpi-num.orange{color:var(--orange600)}
.kpi-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--g500)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--rfull);font-size:11px;font-weight:600}
.chip-green{background:var(--green50);color:var(--green700)}
.chip-orange{background:var(--orange50);color:var(--orange700)}
.chip-blue{background:var(--blue50);color:var(--blue700)}
.chip-g{background:var(--g150);color:var(--g600)}

.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r16);box-shadow:var(--sh-xs)}
.card-pad{padding:24px 26px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.sec-title{font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--g900);letter-spacing:-.02em;line-height:1.15}
.sec-sub{font-size:13px;color:var(--g500);margin-top:5px;max-width:74ch}
.card-title{font-size:15px;font-weight:600;color:var(--g900);letter-spacing:-.01em}
.card-sub{font-size:12.5px;color:var(--g500);margin-top:3px}

/* HERO */
.hero{background:var(--white);border:1px solid var(--g200);border-radius:var(--r16);padding:34px 40px;margin-bottom:24px;
  position:relative;overflow:hidden;box-shadow:var(--sh-xs)}
.hero-eye{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--orange600);margin-bottom:14px}
.hero-h{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.04;margin-bottom:14px;color:var(--g900);text-wrap:balance}
.hero-h .amp{color:var(--orange500)}
.hero-p{font-size:14.5px;color:var(--g600);max-width:62ch;line-height:1.6}
.hero-metrics{display:flex;gap:48px;margin-top:28px;flex-wrap:wrap}
.hm-num{font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:-.03em;color:var(--g900)}
.hm-lbl{font-size:11px;color:var(--g500);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--rfull);font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.b-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-open{background:var(--orange50);color:var(--orange700)} .b-open .b-dot{background:var(--orange500)}
.b-gem{background:var(--orange500);color:#fff;box-shadow:0 2px 8px rgba(249,99,2,.3)}
.b-verified{background:var(--green50);color:var(--green700)} .b-verified .b-dot{background:var(--green500)}
.b-blue{background:var(--blue50);color:var(--blue700)} .b-blue .b-dot{background:var(--blue500)}
.b-purple{background:var(--orange50);color:var(--orange700)}
.b-grey{background:var(--g150);color:var(--g600)}

.skchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r6);font-size:11.5px;font-weight:500;
  background:var(--g150);color:var(--g600);border:1px solid transparent}
.skchip.hit{background:var(--orange50);color:var(--orange700);border-color:var(--orange100);font-weight:600}

.mbar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.mbar-lbl{font-size:11.5px;color:var(--g600);width:150px;flex-shrink:0;font-weight:500}
.mbar-track{flex:1;height:7px;background:var(--g150);border-radius:99px;overflow:hidden}
.mbar-fill{height:100%;border-radius:99px;background:var(--orange500);transition:width .7s cubic-bezier(.22,1,.36,1)}
.mbar-fill.blue{background:var(--g400)}
.mbar-val{font-size:12px;font-weight:600;color:var(--g800);width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* MATCH ENGINE */
.engine-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.role-card{display:flex;align-items:center;gap:16px}
.role-ico{width:50px;height:50px;border-radius:var(--r12);background:var(--g900);display:flex;align-items:center;justify-content:center;color:var(--orange500);flex-shrink:0}
.role-ico svg{width:24px;height:24px;stroke-width:1.8}
.role-name{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--g900);letter-spacing:-.02em}
.role-meta{font-size:12.5px;color:var(--g500);margin-top:3px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}

.callout-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.callout{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);
  padding:16px 18px;display:flex;align-items:center;gap:14px}
.callout .co-ico{width:38px;height:38px;border-radius:var(--r8);background:var(--orange50);color:var(--orange600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.callout .co-ico svg{width:19px;height:19px;stroke-width:1.8}
.co-num{font-size:18px;font-weight:600;color:var(--g900);letter-spacing:-.02em;line-height:1.05}
.co-lbl{font-size:11.5px;color:var(--g500);margin-top:3px}

.slate{display:flex;flex-direction:column;gap:10px}
.cand{background:var(--white);border:1px solid var(--g200);border-radius:var(--r12);padding:16px 18px;display:flex;
  align-items:center;gap:18px;cursor:pointer;transition:box-shadow .2s ease,transform .35s cubic-bezier(.22,1,.36,1),border-color .2s ease;box-shadow:var(--sh-xs)}
.cand:hover{box-shadow:var(--sh-md);border-color:var(--g300);transform:translateY(-2px)}
.cand.gem{border-color:var(--orange100);background:var(--orange50)}
.cand-rank{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--g300);width:32px;text-align:center;flex-shrink:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cand.gem .cand-rank{color:var(--orange500)}
.cand-av{width:44px;height:44px;border-radius:var(--rfull);background:var(--g100);border:1px solid var(--g200);color:var(--g700);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.cand.gem .cand-av{background:var(--g900);color:#fff;border-color:var(--g900)}
.cand-id{width:240px;flex:0 1 240px;min-width:120px}
.cand-name{font-size:14.5px;font-weight:600;color:var(--g900);display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.cand-role{font-size:12px;color:var(--g500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-mid{width:150px;flex-shrink:0}
.cand-move{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;flex-shrink:0;width:72px;justify-content:flex-end}
.move-up{color:var(--green600)} .move-down{color:var(--red600)} .move-flat{color:var(--g400)}
.cand-score{text-align:right;width:70px;flex-shrink:0}
.cs-num{font-size:23px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cs-num.orange{color:var(--orange600)} .cs-num.grey{color:var(--g900)}
.cs-lbl{font-size:9.5px;color:var(--g400);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.cand-chev{color:var(--g300);flex-shrink:0;transition:transform .2s,color .2s}
.cand:hover .cand-chev{color:var(--orange500);transform:translateX(3px)}
.cand-chev svg{width:18px;height:18px;stroke-width:2}

/* SLIDE-OVER */
.overlay{position:fixed;inset:0;background:rgba(30,27,24,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .3s;z-index:200}
.overlay.on{opacity:1;visibility:visible}
.panel{position:fixed;top:0;right:0;height:100vh;width:540px;max-width:92vw;background:var(--white);box-shadow:var(--sh-panel);
  transform:translateX(100%);transition:transform .38s cubic-bezier(.22,1,.36,1);z-index:201;display:flex;flex-direction:column;overflow-y:auto}
.panel.on{transform:translateX(0)}
.panel-head{padding:28px 30px 22px;border-bottom:1px solid var(--g200);position:sticky;top:0;background:var(--white);z-index:2}
.panel-close{position:absolute;top:22px;right:24px;width:32px;height:32px;border-radius:var(--r8);border:1px solid var(--g200);
  background:var(--white);cursor:pointer;color:var(--g500);display:flex;align-items:center;justify-content:center;transition:all .16s}
.panel-close:hover{background:var(--g100);color:var(--g800)}
.panel-body{padding:24px 30px 48px}
.pp-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.pp-av{width:56px;height:56px;border-radius:var(--rfull);background:var(--g900);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0;font-family:var(--font-display)}
.pp-name{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--g900);letter-spacing:-.02em}
.pp-role{font-size:13px;color:var(--g500);margin-top:2px}
.pp-scorebar{display:flex;gap:12px;margin:18px 0 4px}
.pp-sc{flex:1;background:var(--g100);border:1px solid var(--g200);border-radius:var(--r12);padding:14px 16px}
.pp-sc-num{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--g900);font-variant-numeric:tabular-nums}
.pp-sc-num.orange{color:var(--orange600)}
.pp-sc-lbl{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.panel-sec-t{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.1em;margin:26px 0 14px}

.ai-card{background:var(--g100);border:1px solid var(--g200);border-radius:var(--r16);padding:20px 22px;margin-bottom:22px}
.ai-head{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
.ai-badge{display:inline-flex;align-items:center;gap:6px;background:var(--orange50);color:var(--orange700);border:1px solid var(--orange100);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:var(--rfull)}
.ai-badge svg{width:13px;height:13px;stroke-width:2}
.ai-sub{font-size:11.5px;color:var(--g500)}
.ai-items{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ai-card.vert .ai-items{grid-template-columns:1fr;gap:16px}
.prof-grid>.ai-card{margin-bottom:0}
.ai-item{display:flex;gap:12px;align-items:flex-start}
.ai-ico{width:32px;height:32px;border-radius:var(--r8);background:var(--white);border:1px solid var(--g200);color:var(--orange600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-ico svg{width:16px;height:16px;stroke-width:1.8}
.ai-it-t{font-size:13px;font-weight:600;color:var(--g900);line-height:1.3;margin-bottom:3px}
.ai-it-p{font-size:12px;color:var(--g600);line-height:1.5}
.ai-it-p strong{color:var(--orange700);font-weight:600}
.ai-note{background:var(--g100);border:1px solid var(--g200);border-radius:var(--r12);padding:15px 17px;display:flex;gap:13px;margin-bottom:20px}
.ai-note-ico{width:32px;height:32px;border-radius:var(--r8);background:var(--orange50);border:1px solid var(--orange100);color:var(--orange600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-note-ico svg{width:17px;height:17px;stroke-width:2}
.ai-note-t{font-size:10px;font-weight:700;color:var(--orange700);margin-bottom:5px;text-transform:uppercase;letter-spacing:.09em}
.ai-note-p{font-size:13px;color:var(--g700);line-height:1.6}

.filt-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}

<script>
const $ = id => document.getElementById(id);

/* ============ DATA ============ */
// Skills taxonomy \u2014 shared across assessments, roles, matching
const SKILLS = [
  {k:'AR', label:'Analytical Reasoning'},
  {k:'DF', label:'Data Fluency'},
  {k:'ST', label:'Systems Thinking'},
  {k:'PD', label:'Process Design'},
  {k:'CO', label:'Customer Obsession'},
  {k:'PL', label:'People Leadership'}
];

// The open role driving the hero \u2014 requirement weights sum to 1.0
const ROLE = {
  name:'Sr. Analyst, Supply Chain Optimization',
  org:'Supply Chain \u00b7 Atlanta SSC',
  grade:'Grade 6 \u00b7 Corporate',
  weights:{AR:.25, DF:.22, ST:.20, PD:.15, CO:.10, PL:.08}
};

// Candidate pool. skills = assessed 0-100. resume = credential/resume score 0-100.
const CANDIDATES = [
  {id:'MB', name:'Marcus Bell', role:'Store Ops Associate \u00b7 Store #2104', tenure:'3 yrs', loc:'Marietta, GA',

  {id:'RP', name:'Raj Patel', role:'Business Analyst \u00b7 Corporate', tenure:'4 yrs', loc:'Atlanta, GA',

    cred:'BBA \u00b7 Business Analyst \u00b7 4 yrs', note:'Well-rounded and credentialed \u2014 a genuinely strong match on both lenses.'},
  {id:'EC', name:'Emily Chen', role:'Merchandise Planner \u00b7 Corporate', tenure:'3 yrs', loc:'Atlanta, GA',

    cred:'BS \u00b7 Merch Planner \u00b7 3 yrs', note:'Balanced profile with strong process design; a reliable mid-slate fit.'},
  {id:'DF', name:'Derek Foster', role:'Freight Team Lead \u00b7 Store #2104', tenure:'5 yrs', loc:'Marietta, GA',

    cred:'HS diploma \u00b7 freight lead \u00b7 5 yrs', note:'Strong process + leadership from running freight flow; assessments show untapped analytical range.'}
];

// Featured associate for the Talent Profile view
const ME = CANDIDATES[0]; // Marcus Bell

// ---- matching math (real, computed) ----
function matchScore(skills){
  let s=0; for(const k in ROLE.weights){ s += ROLE.weights[k]*skills[k]; }
  return s;
}
function talentComposite(c){ return 0.72*matchScore(c.skills) + 0.18*c.potential + 0.10*c.adjacency; }

// precompute ranks
CANDIDATES.forEach(c=>{ c.match=matchScore(c.skills); c.talent=talentComposite(c); });
const byResume = [...CANDIDATES].sort((a,b)=>b.resume-a.resume);
byResume.forEach((c,i)=>c.resumeRank=i+1);
const byTalent = [...CANDIDATES].sort((a,b)=>b.match-a.match);
byTalent.forEach((c,i)=>c.talentRank=i+1);
CANDIDATES.forEach(c=> c.jump = c.resumeRank - c.talentRank); // + means talent surfaced them

// opportunities for marketplace / profile (match computed vs ME)
const OPPS = [
  {name:'Sr. Analyst, Supply Chain Optimization', org:'Supply Chain \u00b7 Atlanta SSC', type:'Full-time role', cat:'Supply Chain', weights:ROLE.weights},
  {name:'Inventory Data Analyst', org:'Merchandising \u00b7 Atlanta SSC', type:'Full-time role', cat:'Data & Analytics', weights:{AR:.22,DF:.30,ST:.18,PD:.15,CO:.08,PL:.07}},
  {name:'Process Improvement Specialist', org:'Store Operations \u00b7 Field', type:'Full-time role', cat:'Operations', weights:{AR:.18,DF:.14,ST:.22,PD:.30,CO:.10,PL:.06}},

  {name:'Demand Planning Analyst', org:'Supply Chain \u00b7 Atlanta SSC', type:'Full-time role', cat:'Supply Chain', weights:{AR:.26,DF:.24,ST:.22,PD:.14,CO:.08,PL:.06}},
  {name:'Ops Excellence Project (12-wk gig)', org:'Store Operations \u00b7 Field', type:'Stretch gig', cat:'Operations', weights:{AR:.20,DF:.16,ST:.20,PD:.24,CO:.14,PL:.06}},
  {name:'Assortment Analytics Rotation', org:'Merchandising \u00b7 Atlanta SSC', type:'6-mo rotation', cat:'Data & Analytics', weights:{AR:.24,DF:.26,ST:.18,PD:.14,CO:.12,PL:.06}},
  {name:'Team Lead, Front End', org:'Store #2104 \u00b7 Field', type:'Full-time role', cat:'Operations', weights:{AR:.10,DF:.08,ST:.16,PD:.22,CO:.22,PL:.22}}
];
OPPS.forEach(o=>{ let s=0; for(const k in o.weights) s+=o.weights[k]*ME.skills[k]; o.match=Math.round(s); });

/* ============ ICONS ============ */

function countUp(el,to,dur){
  dur=dur||650;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent=to; return; }
  const start=performance.now();
  function tick(now){ const t=Math.min(1,(now-start)/dur); const e=1-Math.pow(1-t,3);
    el.textContent=Math.round(to*e); if(t<1) requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}

function slopeGraph(){
  const W=380,H=248,lx=54,rx=286,top=36,bot=222;
  const y=r=>top+(r-1)/9*(bot-top);
  let lines='',dots='';
  CANDIDATES.forEach((c,i)=>{
    const y1=y(c.resumeRank),y2=y(c.talentRank),gem=c.jump>=3;
    const col=gem?'#F96302':'#D8D6D2',w=gem?2.4:1.3,op=gem?1:.6,dc=gem?'#F96302':'#A6A39D',r=gem?4:2.8;
    lines+=`<path class="slope-line" data-id="${c.id}" pathLength="1" style="animation-delay:${(i*0.06).toFixed(2)}s" onclick="event.stopPropagation();openCand('${c.id}')" d="M${lx} ${y1} C ${(lx+rx)/2} ${y1}, ${(lx+rx)/2} ${y2}, ${rx} ${y2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"><title>${c.name} \u2014 resume #${c.resumeRank} \u2192 talent #${c.talentRank}</title></path>`;
    dots+=`<circle cx="${lx}" cy="${y1}" r="${r}" fill="${dc}"/><circle cx="${rx}" cy="${y2}" r="${r}" fill="${dc}"/>`;
  });
  const t1=CANDIDATES.find(c=>c.talentRank===1);
  const nm=t1.name.split(' ')[0]+' '+t1.name.split(' ')[1][0]+'.';
  const axis=`<line x1="${lx}" y1="${top-4}" x2="${lx}" y2="${bot+6}" stroke="#EAE9E6"/><line x1="${rx}" y1="${top-4}" x2="${rx}" y2="${bot+6}" stroke="#EAE9E6"/>`;
  const head=`<text x="${lx}" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#837F79" letter-spacing="1">RESUME</text><text x="${rx}" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#B4470A" letter-spacing="1">TALENT</text>`;
  const guide=`<text x="${lx-12}" y="${y(1)+3}" text-anchor="end" font-size="9" fill="#A6A39D">#1</text><text x="${lx-12}" y="${y(10)+3}" text-anchor="end" font-size="9" fill="#A6A39D">#10</text>`;
  const label=`<text x="${rx+9}" y="${y(1)+4}" font-size="10.5" font-weight="700" fill="#1E1B18">${nm}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">${axis}${head}${guide}${lines}${dots}${label}</svg>`;
}

function flipSlate(prevPos){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.querySelectorAll('#slate .cand').forEach(el=>{
    const oldTop=prevPos[el.dataset.id]; if(oldTop==null) return;
    const dy=oldTop-el.getBoundingClientRect().top; if(!dy) return;
    el.style.transition='none'; el.style.transform=`translateY(${dy}px)`;
    requestAnimationFrame(()=>{ el.style.transition='transform .55s cubic-bezier(.22,1,.36,1)'; el.style.transform=''; });
  });
}

        <div class="as-drop-ico">${svg(hasR?IC.doc:IC.upload,26)}</div>
        <div style="font-size:13px;font-weight:600;color:var(--g800)">${hasR?SESSION.resumeName:'Click to upload (PDF, DOC, TXT)'}</div>
        <div style="font-size:11.5px;color:var(--g500);margin-top:4px">${hasR?'Attached \u00b7 for reference only':'Resume Second \u2014 kept for reference, your score comes from the assessment'}</div>
        <input type="file" id="asResume" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="asFile(this)">
      </label>
      <div class="as-label" style="margin:20px 0 8px">Step 2 \u00b7 The assessment</div>
      <button class="btn btn-orange" style="width:100%;justify-content:center;height:46px" onclick="asBegin()">${svg(IC.spark,16)} Start assessment</button>
      <div class="as-note" style="justify-content:center"><button class="lnk" onclick="asSignOut()">Sign out</button></div>
    </div></div>`;
    return;
  }
  if(P==='quiz'){
    const total=ASSESS.length, i=asState.step, q=ASSESS[i];
    const capName=SKILLS.find(s=>s.k===q.cap).label;
    root.innerHTML=`<div class="as-wrap"><div class="as-card">
      <div class="as-progress"><div class="as-ptrack"><div class="as-pfill" style="width:${Math.round((i+1)/total*100)}%"></div></div><div class="as-pnum">${i+1} / ${total}</div></div>
      <div class="as-qcap">${capName}</div>
      <div class="as-q">${q.q}</div>
      <div class="as-opts">${q.o.map((op,oi)=>`<button class="as-opt ${asState.answers[i]===oi?'sel':''}" onclick="asAnswer(${i},${oi})"><span class="dot"></span><span>${op[0]}</span></button>`).join('')}</div>
      ${i>0?'<button class="as-back" onclick="asBack()">\u2190 Back</button>':''}
    </div></div>`;
    return;
  }
  if(P==='results'){
    destroyCharts();
    refreshOppMatches();
    const U=activeProfile();
    const tops=[...OPPS].sort((a,b)=>b.match-a.match).slice(0,3);
    const ranked=SKILLS.map(s=>({s,v:U.skills[s.k]})).sort((a,b)=>b.v-a.v);
    const avg=Math.round(SKILLS.reduce((a,s)=>a+U.skills[s.k],0)/SKILLS.length);
    const band=avg>=82?'High-potential':avg>=70?'Strong performer':'Developing';
    const bars=ranked.map(r=>`<div class="mbar-row"><div class="mbar-lbl">${r.s.label}</div><div class="mbar-track"><div class="mbar-fill" style="width:${r.v}%"></div></div><div class="mbar-val">${r.v}</div></div>`).join('');
    const opps=tops.map(o=>`<div class="opp-card" onclick="nav('marketplace')"><div class="opp-top"><div><div class="opp-name">${o.name}</div><div class="opp-org">${o.org}</div></div><div class="opp-pct">${o.match}<small>%</small></div></div><div class="mbar-track" style="margin-top:8px"><div class="mbar-fill" style="width:${o.match}%"></div></div></div>`).join('');
    root.innerHTML=`<div class="as-wrap" style="max-width:900px">
      <div class="as-res-head"><div class="as-res-av">${initials(U.name).toUpperCase()}</div><div><div class="as-h" style="margin:0">Your Talent DNA is ready, ${U.name.split(' ')[0]}</div><div class="as-sub" style="margin:4px 0 0">${band} \u00b7 average capability ${avg} \u00b7 measured across 6 dimensions</div></div></div>
      <div class="prof-grid" style="margin-top:22px">
        <div class="card card-pad"><div class="card-title" style="margin-bottom:2px">Your Talent DNA</div><div class="card-sub" style="margin-bottom:8px">From your assessment \u2014 not your resume</div><div class="chart-box"><canvas id="asRadar"></canvas></div></div>
        <div class="card card-pad"><div class="card-title" style="margin-bottom:14px">Capability scores</div>${bars}</div>
      </div>
      <div class="card card-pad" style="margin-top:22px"><div class="card-title" style="margin-bottom:4px">Your top matches</div><div class="card-sub" style="margin-bottom:14px">Roles where your measured capability fits best right now</div><div class="mkt-grid">${opps}</div></div>
      <div class="as-actions">
        <button class="btn btn-orange" onclick="nav('profile')">${svg(IC.user,15)} View my full profile</button>
        <button class="btn btn-ghost" onclick="nav('marketplace')">${svg(IC.grid,15)} Browse matched roles</button>
        <button class="btn btn-ghost" onclick="asRetake()">Retake</button>
        <button class="btn btn-ghost" onclick="asSignOut()">Sign out</button>
      </div>
    </div>`;
    charts.push(new Chart(document.getElementById('asRadar').getContext('2d'),{
      type:'radar',
      data:{labels:SKILLS.map(s=>s.label),datasets:[{label:'You (assessed)',data:SKILLS.map(s=>U.skills[s.k]),backgroundColor:'rgba(249,99,2,.15)',borderColor:'#F96302',borderWidth:2,pointBackgroundColor:'#F96302',pointRadius:3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:TT},
        scales:{r:{suggestedMin:0,suggestedMax:100,angleLines:{color:'#EAE9E6'},grid:{color:'#F1F0EE'},pointLabels:{color:'#635F59',font:{size:11,weight:'500'}},ticks:{display:false,stepSize:25}}}}
    }));
    return;
  }
}

/* ============ BOOT ============ */
renderUser();
renderNav('match');
$('page').innerHTML = renderMatch();
renderSlate();
</script>
